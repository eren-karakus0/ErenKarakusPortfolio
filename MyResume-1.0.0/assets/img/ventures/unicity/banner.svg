<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Unicity — Machine Economy Apps">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e14"/>
      <stop offset="0.5" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#140f0a"/>
    </linearGradient>
    <radialGradient id="uglow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#ff6f00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uorange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="upink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f81"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ubg)"/>
  <rect width="640" height="400" fill="url(#uglow)"/>
  <text x="320" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" letter-spacing="10" fill="#f4f1ea">UNICITY</text>
  <text x="320" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="15" letter-spacing="6" fill="#ff8a3d">MACHINE ECONOMY APPS</text>

  <!-- Agent Bazaar : hexagon agent -->
  <g transform="translate(140,232)">
    <path d="M0,-27 L23.4,-13.5 L23.4,13.5 L0,27 L-23.4,13.5 L-23.4,-13.5 Z" fill="url(#uorange)"/>
    <g stroke="#1a0d00" stroke-width="2.7" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-11.5"/>
      <line x1="0" y1="0" x2="-10" y2="5.8"/>
      <line x1="0" y1="0" x2="10" y2="5.8"/>
    </g>
    <g fill="#1a0d00">
      <circle cx="0" cy="-11.5" r="3.6"/>
      <circle cx="-10" cy="5.8" r="3.6"/>
      <circle cx="10" cy="5.8" r="3.6"/>
      <circle cx="0" cy="0" r="4.6"/>
    </g>
  </g>
  <text x="140" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="1.5" fill="#e7e2d6">AGENT BAZAAR</text>
  <text x="140" y="311" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8a8578">escrow &#183; MCP</text>

  <!-- Arcade House : die tile -->
  <g transform="translate(320,232)">
    <rect x="-27" y="-27" width="54" height="54" rx="14" fill="url(#uorange)"/>
    <g fill="#0a0a0a">
      <circle cx="-11.5" cy="-11.5" r="4.4"/>
      <circle cx="11.5" cy="-11.5" r="4.4"/>
      <circle cx="0" cy="0" r="4.4"/>
      <circle cx="-11.5" cy="11.5" r="4.4"/>
      <circle cx="11.5" cy="11.5" r="4.4"/>
    </g>
  </g>
  <text x="320" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="1.5" fill="#e7e2d6">ARCADE HOUSE</text>
  <text x="320" y="311" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8a8578">provably-fair</text>

  <!-- Sparks : heart -->
  <g transform="translate(500,232) scale(1.5) translate(-16,-16)">
    <path d="M16 28C4 20 2 12.5 7.2 8.4c3.1-2.4 6.3-.6 8.8 2.9 2.5-3.5 5.7-5.3 8.8-2.9C30 12.5 28 20 16 28Z" fill="url(#upink)"/>
  </g>
  <text x="500" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="1.5" fill="#e7e2d6">SPARKS</text>
  <text x="500" y="311" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8a8578">agent dates</text>
</svg>
